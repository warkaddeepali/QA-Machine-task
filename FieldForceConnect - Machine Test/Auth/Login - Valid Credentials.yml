info:
  name: Login - Valid Credentials
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/account/authenticate"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "email": "{{valid_email}}",
          "password": "{{valid_password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        // Dynamically extract and store the token from the response\r

        try {\r

        \    var jsonData = res.getBody();\r

        \    // Adjust 'token' key path based on the actual API response mapping\r

        \    var token = jsonData.token || (jsonData.data && jsonData.data.token) || jsonData.access_token;\r

        \    if (token) {\r

        \        bru.setEnvVar(\"auth_token\", token);\r

        \        console.log(\"Token successfully set in environment variables.\");\r

        \    } else {\r

        \        console.log(\"Token property not found in the response body layout.\");\r

        \    }\r

        } catch (e) {\r

        \    console.log(\"Error parsing response JSON or capturing token: \", e);\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Logs into the application using valid credentials and automatically extracts the auth token into the environment variables.
