info:
  name: Login - Invalid Credentials
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/account/authenticate"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "email": "invalid_user@example.com",
          "password": "WrongPassword123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 400 or 401\", function () {\r

        \    expect(res.getStatus()).to.be.oneOf([400, 401]);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Tests the authentication endpoint with incorrect credentials to verify proper error handling.
